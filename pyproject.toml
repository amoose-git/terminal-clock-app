[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ascii-clock"
version = "1.0.0"
description = "A second-accurate ASCII clock for the terminal, extensible with split-screen panels"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "tzdata>=2024.1", "prompt_toolkit>=3.0.50"]

[project.scripts]
clock = "app:main"

[tool.setuptools]
py-modules = ["app", "layoutBoxes", "appConfig"]
packages = ["panels", "clock"]
