[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ascii-clock"
version = "1.0.0"
description = "A second-accurate ASCII clock for the Windows terminal"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "blessed>=1.20", "tzdata>=2024.1"]

[project.scripts]
clock = "clock:main"

[tool.setuptools]
py-modules = ["clock", "bigDigits", "layoutBoxes", "buttons",
              "appConfig", "textProviders", "winConsoleInput"]
